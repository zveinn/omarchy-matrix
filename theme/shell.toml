# ░▒▓ MATRIX ▓▒░  Omarchy shell surfaces
# Solid black panels/launcher (bar stays translucent), phosphor-green text, gradient code-rain borders.
# Alerts burn amber, errors glow red.

[bar]
background       = "#000a02"
background-alpha = 0.86
text             = "#00ff41"
active           = "#ffb000"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "#00ff41 #008f11 #003b00 #00ff41 45deg"
active-border-foreground = "#00ff41 #003b00 #00ff41 135deg"

[controls]
normal-color        = "#c8ffc8"
normal-fill-alpha   = 0.0
normal-border       = "#00ff41"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#eaffea"
hover-cursor-fill-alpha   = 0.12
hover-cursor-border       = "#00ff41"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.70

focus-color        = "#eaffea"
focus-fill-alpha   = 0.12
focus-border       = "#00ff41"
focus-border-width = 1
focus-border-alpha = 0.90

selected-color        = "#000000"
selected-fill-alpha   = 0.85
selected-border       = "#00ff41"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.30
selection-fill-alpha = 0.45

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#000000"
background-alpha = 1.0
text             = "#c8ffc8"
border           = "hyprland.active-border"
border-alpha     = 1.0

[tooltip]
background       = "#000301"
background-alpha = 0.95
text             = "#00ff41"
border           = "#00ff41 #003b00 135deg"
border-alpha     = 0.9

[notifications]
background       = "#000a02"
background-alpha = 0.92
text             = "#c8ffc8"
border           = "hyprland.active-border"
border-alpha     = 1.0
countdown        = "#00ff41"

[launcher]
background                = "#000000"
background-alpha          = 1.0
text                      = "#c8ffc8"
border                    = "hyprland.active-border"
border-alpha              = 1.0
scrim                     = "#000301"
scrim-alpha               = 0.55
selected-background       = "#00ff41"
selected-background-alpha = 0.16
selected-text             = "#00ff41"
selected-border           = "#00ff41"
selected-border-alpha     = 0.60

[menu]
background                = "#000000"
background-alpha          = 1.0
text                      = "#c8ffc8"
border                    = "hyprland.active-border"
border-alpha              = 1.0
scrim                     = "#000301"
scrim-alpha               = 0.55
selected-background       = "#00ff41"
selected-background-alpha = 0.16
selected-text             = "#00ff41"
selected-border           = "#00ff41"
selected-border-alpha     = 0.60

[polkit]
background       = "#000602"
background-alpha = 0.95
text             = "#c8ffc8"
text-error       = "#ff7a66"
border           = "hyprland.active-border"
border-error     = "#d65a4a"
border-alpha     = 1.0
scrim            = "#000301"
scrim-alpha      = 0.70
accent           = "#00ff41"

[lock]
background       = "#000301"
background-alpha = 0.85
text             = "#00ff41"
placeholder      = "#3d7a48"
text-error       = "#ff7a66"
border           = "#003b00"
border-active    = "hyprland.active-border"
border-error     = "#d65a4a"
border-alpha     = 1.0
selection        = "#00ff41"
selection-alpha  = 0.40

[image-picker]
scrim                   = "#000301"
scrim-alpha             = 0.70
text                    = "#00ff41"
selected-border         = "#00ff41"
selected-border-alpha   = 1.0
unselected-border       = "#008f11"
unselected-border-alpha = 0.35
